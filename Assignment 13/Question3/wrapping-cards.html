<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stationery Shop</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    .cards {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
    }
    .card {
      background-color: #f9f9f9;
      border: 1px solid #ccc;
      padding: 15px;
      width: 160px;
    }
    .card h3 {
      margin-top: 0;
    }
  </style>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Stationery Shop</h1>
  <div class="cards">
    <div class="card">
      <h3>Notebook</h3>
      <p>60</p>
    </div>
    <div class="card">
      <h3>Pen</h3>
      <p>15</p>
    </div>
    <div class="card">
      <h3>Bag</h3>
      <p>350</p>
    </div>
    <div class="card">
      <h3>Book</h3>
      <p>120</p>
    </div>
  </div>
</body>
</html>
