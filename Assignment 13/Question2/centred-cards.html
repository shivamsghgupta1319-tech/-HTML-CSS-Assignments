<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Centred Cards</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    .row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      min-height: 250px;
      background-color: #f0f0f0;
      padding: 20px;
    }
    .card {
      background-color: white;
      border: 1px solid #ccc;
      padding: 20px;
      width: 140px;
      text-align: center;
    }
    .card h3 {
      margin-top: 0;
    }
  </style>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Pricing Plans</h1>
  <div class="row">
    <div class="card">
      <h3>Starter</h3>
      <p>199</p>
    </div>
    <div class="card">
      <h3>Standard</h3>
      <p>349</p>
    </div>
    <div class="card">
      <h3>Premium</h3>
      <p>499</p>
    </div>
  </div>
</body>
</html>
